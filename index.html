<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Message Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Set theme on initial load
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .custom-loader {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: conic-gradient(#0000 10%, #4f46e5);
            -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 0);
            animation: s3 1s infinite linear;
        }
        @keyframes s3 {
            to {
                transform: rotate(1turn)
            }
        }
        .nav-btn-active {
            background-color: #4f46e5 !important;
            color: white !important;
        }
        .dark .nav-btn-active {
            background-color: #4f46e5 !important;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

    <div class="min-h-screen bg-gradient-to-br from-blue-50 via-purple-50 to-white dark:from-slate-900 dark:via-purple-900/20 dark:to-slate-900 flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 relative">
        
        <!-- Theme Toggle -->
        <div class="absolute top-4 right-4 sm:top-6 sm:right-6">
            <button id="theme-toggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500">
                <svg class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                <svg class="h-6 w-6 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>
        </div>

        <div class="w-full max-w-3xl mx-auto">
            
            <header class="text-center mb-6">
                <h1 class="text-4xl sm:text-5xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">AI Message Analyzer</h1>
                <p class="mt-3 text-lg text-slate-600 dark:text-slate-400">Analyze messages for threats, save results, and generate replies.</p>
            </header>

            <nav class="flex justify-center mb-6 bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm p-2 rounded-xl shadow-md">
                <button id="nav-analyzer" class="nav-btn-active w-1/2 text-center py-2 px-4 rounded-lg font-semibold text-slate-700 dark:text-slate-300 hover:bg-blue-100 dark:hover:bg-slate-700 transition-colors duration-300">Analyzer</button>
                <button id="nav-saved" class="w-1/2 text-center py-2 px-4 rounded-lg font-semibold text-slate-700 dark:text-slate-300 hover:bg-blue-100 dark:hover:bg-slate-700 transition-colors duration-300">Saved Analyses</button>
            </nav>

            <main id="analyzer-view" class="bg-white/70 dark:bg-slate-800/70 backdrop-blur-xl shadow-2xl rounded-2xl p-6 sm:p-8 space-y-6">
                
                <div>
                    <label for="message-content" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Message Content</label>
                    <textarea id="message-content" rows="10" class="w-full p-4 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-200 dark:placeholder-slate-400 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150" placeholder="Paste the message content here..."></textarea>
                </div>

                <div class="text-center">
                    <button id="analyze-btn" class="w-full sm:w-auto bg-gradient-to-r from-blue-600 to-purple-600 text-white font-semibold py-3 px-8 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300">
                        Analyze Message
                    </button>
                </div>

                <div id="results-section" class="hidden pt-6 border-t border-slate-200 dark:border-slate-700 space-y-6">
                    <div id="loader" class="hidden justify-center items-center py-4"><div class="custom-loader"></div></div>
                    <div id="analysis-result" class="hidden space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Analysis Report</h2>
                            <button id="save-analysis-btn" class="w-full sm:w-auto bg-gray-600 dark:bg-slate-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:bg-gray-700 dark:hover:bg-slate-500 transform hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-gray-300">
                                Save Analysis
                            </button>
                        </div>
                        <div><span id="verdict-badge" class="px-4 py-1.5 text-sm font-semibold rounded-full"></span></div>
                        <div id="report-content" class="p-4 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 space-y-2"></div>
                    </div>

                    <div id="reply-section" class="hidden space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                             <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Generated Reply</h2>
                             <button id="generate-reply-btn" class="w-full sm:w-auto bg-gradient-to-r from-green-500 to-teal-500 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus:ring-4 focus:ring-green-300">
                                Generate a Draft Reply
                            </button>
                        </div>
                        <div id="reply-loader" class="hidden justify-center items-center py-4"><div class="custom-loader"></div></div>
                        <div id="reply-output" class="hidden">
                            <textarea id="reply-content" rows="8" class="w-full p-4 border border-slate-300 dark:border-slate-600 rounded-xl shadow-sm bg-slate-50 dark:bg-slate-800" readonly></textarea>
                            <button id="copy-reply-btn" class="mt-2 bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-200 font-semibold py-2 px-4 rounded-lg hover:bg-slate-300 dark:hover:bg-slate-500 transition-all duration-200">
                                Copy Reply
                            </button>
                            <span id="copy-feedback" class="ml-3 text-sm font-medium text-green-600 opacity-0 transition-opacity duration-300">Copied!</span>
                        </div>
                    </div>
                </div>
            </main>

            <section id="saved-analyses-view" class="hidden bg-white/70 dark:bg-slate-800/70 backdrop-blur-xl shadow-2xl rounded-2xl p-6 sm:p-8 space-y-6">
                <h2 class="text-3xl font-bold text-slate-800 dark:text-slate-100 text-center">Saved Analyses</h2>
                <div id="saved-analyses-list" class="space-y-4">
                     <p id="no-saved-analyses" class="text-center text-slate-500 dark:text-slate-400 py-8">You have no saved analyses. Analyze a message to save the result.</p>
                </div>
            </section>
        </div>
        <footer class="text-center py-4 text-sm text-slate-500 dark:text-slate-400 absolute bottom-0">
            &copy; 2025 Immaculate Munde. All rights reserved.
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- DOM Elements ---
        const analyzeBtn = document.getElementById('analyze-btn');
        const messageContent = document.getElementById('message-content');
        const resultsSection = document.getElementById('results-section');
        const loader = document.getElementById('loader');
        const analysisResult = document.getElementById('analysis-result');
        const verdictBadge = document.getElementById('verdict-badge');
        const reportContent = document.getElementById('report-content');
        const replySection = document.getElementById('reply-section');
        const generateReplyBtn = document.getElementById('generate-reply-btn');
        const replyLoader = document.getElementById('reply-loader');
        const replyOutput = document.getElementById('reply-output');
        const replyContent = document.getElementById('reply-content');
        const copyReplyBtn = document.getElementById('copy-reply-btn');
        const copyFeedback = document.getElementById('copy-feedback');
        const saveAnalysisBtn = document.getElementById('save-analysis-btn');
        const navAnalyzer = document.getElementById('nav-analyzer');
        const navSaved = document.getElementById('nav-saved');
        const analyzerView = document.getElementById('analyzer-view');
        const savedAnalysesView = document.getElementById('saved-analyses-view');
        const savedAnalysesList = document.getElementById('saved-analyses-list');
        const noSavedAnalysesMsg = document.getElementById('no-saved-analyses');
        const themeToggle = document.getElementById('theme-toggle');
        
        // --- State ---
        let currentAnalysis = {};
        let db, auth, userId;

        // --- Theme Setup ---
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
        


        // --- Firebase Initialization ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                setupRealtimeListener();
            } else {
                try {
                     if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch(e) { console.error("Anonymous sign-in failed", e) }
            }
        });

        const API_KEY = "";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${API_KEY}`;

        // --- API Call ---
        async function callGemini(prompt, systemInstruction, retries = 3, delay = 1000) {
            const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] } };
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();
                    if (result.candidates?.[0]?.content?.parts?.[0]?.text) return result.candidates[0].content.parts[0].text;
                    else throw new Error("Invalid response structure from API.");
                } catch (error) {
                    console.error(`Attempt ${i+1} failed:`, error);
                    if (i < retries - 1) {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    } else return "Error: Unable to get a response from the AI.";
                }
            }
        }

        // --- Event Listeners ---
        analyzeBtn.addEventListener('click', handleAnalysis);
        generateReplyBtn.addEventListener('click', handleReplyGeneration);
        copyReplyBtn.addEventListener('click', handleCopy);
        saveAnalysisBtn.addEventListener('click', saveAnalysis);
        navAnalyzer.addEventListener('click', () => switchView('analyzer'));
        navSaved.addEventListener('click', () => switchView('saved'));

        // --- Core Functions ---
        async function handleAnalysis() {
            const messageText = messageContent.value;
            if (messageText.trim() === '') {
                alert('Please paste some message content to analyze.');
                return;
            }
            resultsSection.classList.remove('hidden');
            analysisResult.classList.add('hidden');
            replySection.classList.add('hidden');
            replyOutput.classList.add('hidden');
            loader.style.display = 'flex';

            const systemInstruction = `You are a cybersecurity expert. Analyze the following message.
            Your response MUST be in this exact format:
            Verdict: [LEGIT/SUSPICIOUS/SCAM]
            Report:
            - [A brief, one-sentence summary of the key reason for your verdict]
            - [Another key point]
            - [And another, if necessary]`;

            const aiResponse = await callGemini(messageText, systemInstruction);
            loader.style.display = 'none';
            analysisResult.classList.remove('hidden');
            parseAndDisplayAnalysis(aiResponse);
        }
        
        function parseAndDisplayAnalysis(response) {
            const verdictMatch = response.match(/Verdict: (LEGIT|SUSPICIOUS|SCAM)/);
            const reportMatch = response.split(/Report:/);
            const verdict = verdictMatch ? verdictMatch[1] : null;
            const reportText = reportMatch[1] ? reportMatch[1].trim() : "No detailed report generated.";

            currentAnalysis = { content: messageContent.value, verdict, report: reportText, timestamp: serverTimestamp() };

            if (!verdict) {
                verdictBadge.textContent = "Error";
                verdictBadge.className = "px-4 py-1.5 text-sm font-semibold rounded-full bg-gray-200 text-gray-800";
                reportContent.innerHTML = `<p>The AI could not determine a verdict. The response was:</p><p class="mt-2 italic">${response}</p>`;
                return;
            }

            const reportHTML = reportText.split('- ').filter(line => line.trim() !== '').map(line => `<li>${line.trim()}</li>`).join('');
            verdictBadge.textContent = verdict;
            reportContent.innerHTML = `<ul class="list-disc list-inside space-y-1">${reportHTML}</ul>`;
            
            switch (verdict.toUpperCase()) {
                case 'LEGIT':
                    verdictBadge.className = "px-4 py-1.5 text-sm font-semibold rounded-full bg-green-100 text-green-800";
                    replySection.classList.remove('hidden');
                    break;
                case 'SUSPICIOUS':
                    verdictBadge.className = "px-4 py-1.5 text-sm font-semibold rounded-full bg-yellow-100 text-yellow-800";
                    replySection.classList.add('hidden');
                    break;
                case 'SCAM':
                    verdictBadge.className = "px-4 py-1.5 text-sm font-semibold rounded-full bg-red-100 text-red-800";
                    replySection.classList.add('hidden');
                    break;
            }
        }

        async function handleReplyGeneration() {
            replyLoader.style.display = 'flex';
            replyOutput.classList.add('hidden');
            const systemInstruction = "You are a helpful assistant. Draft a professional and polite reply to the following message. The reply should be ready to send.";
            const aiReply = await callGemini(currentAnalysis.content, systemInstruction);
            replyLoader.style.display = 'none';
            replyContent.value = aiReply;
            replyOutput.classList.remove('hidden');
        }

        function handleCopy() {
            replyContent.select();
            try {
                document.execCommand('copy');
                copyFeedback.classList.remove('opacity-0');
                setTimeout(() => copyFeedback.classList.add('opacity-0'), 2000);
            } catch (err) { console.error('Failed to copy text: ', err); }
        }

        // --- Firestore Functions ---
        async function saveAnalysis() {
            if (!userId || !currentAnalysis.verdict) return;
            try {
                const collectionPath = `/artifacts/${appId}/users/${userId}/scanned_analyses`;
                await addDoc(collection(db, collectionPath), currentAnalysis);
                switchView('saved');
            } catch (e) { console.error("Error adding document: ", e); }
        }

        function setupRealtimeListener() {
            if (!userId) return;
            const collectionPath = `/artifacts/${appId}/users/${userId}/scanned_analyses`;
            const q = collection(db, collectionPath);
            onSnapshot(q, (querySnapshot) => {
                savedAnalysesList.innerHTML = ''; 
                if (querySnapshot.empty) {
                     savedAnalysesList.appendChild(noSavedAnalysesMsg);
                } else {
                    querySnapshot.forEach((doc) => renderSavedAnalysis(doc.id, doc.data()));
                }
            });
        }

        function renderSavedAnalysis(id, data) {
            const card = document.createElement('div');
            card.className = "p-4 bg-slate-50 dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700";
            
            let badgeClass = 'bg-gray-200 text-gray-800';
            if (data.verdict === 'LEGIT') badgeClass = 'bg-green-100 text-green-800';
            if (data.verdict === 'SUSPICIOUS') badgeClass = 'bg-yellow-100 text-yellow-800';
            if (data.verdict === 'SCAM') badgeClass = 'bg-red-100 text-red-800';

            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="px-3 py-1 text-xs font-semibold rounded-full ${badgeClass}">${data.verdict}</span>
                    <button data-id="${id}" class="delete-btn text-slate-400 dark:text-slate-500 hover:text-red-600 dark:hover:text-red-500 transition-colors">&times;</button>
                </div>
                <p class="mt-3 font-semibold text-slate-700 dark:text-slate-300 truncate">Content: ${data.content.substring(0, 80)}...</p>
                <details class="mt-2 text-sm text-slate-600 dark:text-slate-400">
                    <summary class="cursor-pointer font-medium">View Report</summary>
                    <div class="mt-2 pl-4 border-l-2 border-slate-200 dark:border-slate-600">
                        <ul class="list-disc list-inside">${data.report.split('- ').filter(line => line.trim() !== '').map(line => `<li>${line.trim()}</li>`).join('')}</ul>
                    </div>
                </details>`;
            savedAnalysesList.appendChild(card);
            
            card.querySelector('.delete-btn').addEventListener('click', async (e) => {
                const docId = e.target.getAttribute('data-id');
                // A custom modal would be better than confirm()
                if (window.confirm('Are you sure you want to delete this analysis?')) {
                     try {
                        const docPath = `/artifacts/${appId}/users/${userId}/scanned_analyses/${docId}`;
                        await deleteDoc(doc(db, docPath));
                    } catch (e) { console.error("Error deleting document: ", e); }
                }
            });
        }
        
        // --- View Switching ---
        function switchView(view) {
            if (view === 'analyzer') {
                analyzerView.classList.remove('hidden');
                savedAnalysesView.classList.add('hidden');
                navAnalyzer.classList.add('nav-btn-active');
                navSaved.classList.remove('nav-btn-active');
            } else {
                analyzerView.classList.add('hidden');
                savedAnalysesView.classList.remove('hidden');
                navAnalyzer.classList.remove('nav-btn-active');
                navSaved.classList.add('nav-btn-active');
            }
        }
    </script>
</body>
</html>
